name: Publish Hvost website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate APK archives
        run: |
          python3 - <<'PYAPK'
          import json,pathlib,hashlib
          for r in json.load(open('versions.json'))['releases']:
              file=pathlib.Path(r['fileName'])
              assert file.stat().st_size==r['bytes'],file.name
              assert hashlib.sha256(file.read_bytes()).hexdigest()==r['sha256'],file.name
          PYAPK
      - name: Validate release metadata and public-only files
        run: |
          python3 - <<'PYCHECK'
          import pathlib,json,zipfile
          root=pathlib.Path('.')
          release=json.loads((root/'release.json').read_text());feed=json.loads((root/'update.json').read_text());catalog=json.loads((root/'versions.json').read_text())
          assert release['versionCode']==feed['versionCode']==catalog['latest']
          assert release['sha256']==feed['sha256'] and release['bytes']==feed['bytes']
          assert feed['parts']==[{'url':release['fileName'],'size':release['bytes']}]
          base='https://nicolenkoe.github.io/hvost-pod-kontrolem-downloads/'
          archive='https://raw.githubusercontent.com/nicolenkoe/hvost-pod-kontrolem-downloads/37d513e08d7828751d53d1c723658285a17ea480/'
          for entry in catalog['releases']:assert entry['downloadUrl']==(base if entry['versionCode']==release['versionCode'] else archive)+entry['fileName']
          for p in root.rglob('*'):
            if '.git' in p.parts:continue
            assert p.suffix not in {'.java','.kt','.ino','.jks','.keystore'},p
          for p in (root/'firmware').glob('*.zip'):
            with zipfile.ZipFile(p) as z:assert not any(n.endswith(('.ino','.java','.kt','.jks','.keystore')) for n in z.namelist())
          PYCHECK
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p /tmp/hvost-site
          tar --exclude=.git --exclude=.github --exclude='*.apk' -cf - . | tar -xf - -C /tmp/hvost-site
          python3 - <<'PYSTAGE'
          import pathlib,json,shutil
          release=json.load(open('release.json'));target=pathlib.Path('/tmp/hvost-site')
          shutil.copy2(release['fileName'],target/release['fileName'])
          total=sum(p.stat().st_size for p in target.rglob('*') if p.is_file())
          assert total < 1024**3, 'Pages site exceeds its 1GB limit'
          print('Pages site bytes:',total)
          PYSTAGE
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/hvost-site
      - name: Deploy the exact uploaded Pages artifact
        id: deploy
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,422
          script: |
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^[0-9]+$/.test(artifactId || '')) throw new Error('Uploaded artifact ID missing');
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
            const params = {owner: context.repo.owner, repo: context.repo.repo};
            // Use the upload output directly: listing by name races and duplicates on reruns.
            let stable = 0;
            for (let attempt = 0; attempt < 30; attempt++) {
              try {
                const result = await github.rest.actions.getArtifact({...params, artifact_id: Number(artifactId), request: {timeout: 30000}});
                stable = result.data.id === Number(artifactId) && !result.data.expired ? stable + 1 : 0;
                if (stable >= 3) break;
              } catch (error) { stable = 0; }
              await wait(5000);
            }
            if (stable < 3) throw new Error('Uploaded Pages artifact is not consistently readable');
            // Artifact metadata and the Pages deployment store become visible separately.
            await wait(20000);
            const oidc = await core.getIDToken();
            let deployment;
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const response = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {...params, artifact_id: Number(artifactId), pages_build_version: context.sha, oidc_token: oidc, request: {timeout: 30000}});
                deployment = response.data;
                break;
              } catch (error) {
                if (![404, 409, 500, 502, 503, 504].includes(error.status) || attempt === 11) throw error;
                core.info('Pages artifact not ready; retrying the same uploaded ID');
                await wait(5000);
              }
            }
            const deploymentId = deployment.id || deployment.status_url?.split('/').pop() || context.sha;
            core.setOutput('page_url', deployment.page_url || 'https://nicolenkoe.github.io/hvost-pod-kontrolem-downloads/');
            const deadline = Date.now() + 600000;
            for (let attempt = 0; Date.now() < deadline; attempt++) {
              const response = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {...params, deploymentId, request: {timeout: 30000}});
              const status = response.data.status;
              if (status === 'succeed') { core.info('Pages deployment succeeded'); return; }
              if (['errored', 'failed', 'cancelled', 'deployment_failed', 'deployment_content_failed', 'deployment_perms_error', 'deployment_cancelled', 'deployment_lost'].includes(status)) throw new Error('Pages deployment ' + status);
              await wait(5000);
            }
            throw new Error('Pages deployment timed out');
      - name: Verify independent public release
        run: python3 verify_public.py
      - uses: actions/upload-artifact@v4
        with:
          name: hvost-public-verification
          path: public-verification.json

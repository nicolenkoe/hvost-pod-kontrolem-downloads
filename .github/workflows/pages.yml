name: Publish Hvost website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate APK archives
        run: |
          python3 - <<'PYAPK'
          import json,pathlib,hashlib
          for r in json.load(open('versions.json'))['releases']:
              file=pathlib.Path(r['fileName'])
              assert file.stat().st_size==r['bytes'],file.name
              assert hashlib.sha256(file.read_bytes()).hexdigest()==r['sha256'],file.name
          PYAPK
      - uses: actions/configure-pages@v5
      - name: Prepare static files
        run: |
          mkdir -p /tmp/hvost-site
          tar --exclude=.git --exclude=.github -cf - . | tar -xf - -C /tmp/hvost-site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/hvost-site
      - uses: actions/deploy-pages@v4
        id: deploy
